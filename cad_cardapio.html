<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EconoTechBI - Gerenciador do Cardápio</title>
  <!-- Tailwind CSS CDN para estilização rápida -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SDK do Supabase para integração simplificada -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-8">

  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Cabeçalho -->
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-3xl font-extrabold text-cyan-400">EconoTechBI - Comanda Virtual</h1>
      <p class="text-slate-400 text-sm mt-1">Gerenciamento de Cardápio e Lucratividade dos Insumos</p>
    </div>

    <!-- Formulário de Cadastro de Produto -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <h2 class="text-xl font-bold text-white mb-4">Adicionar Novo Item ao Cardápio</h2>
      
      <form id="formProduto" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nome do Produto / Prato *</label>
          <input type="text" id="nomeProduto" placeholder="Ex: Hambúrguer Artesanal" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Preço de Venda (R$) *</label>
          <input type="number" id="precoVenda" step="0.01" placeholder="Ex: 35.00" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Custo do Insumo (R$) *</label>
          <input type="number" id="custoInsumo" step="0.01" placeholder="Ex: 12.50" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500">
        </div>

        <!-- Campo Descrição -->
        <div class="sm:col-span-2">
          <label class="block text-xs font-semibold text-slate-300 mb-1">Descrição do Lanche, Prato ou Bebida *</label>
          <textarea id="descricaoProduto" rows="2" placeholder="Ex: Pão brioche, blend 180g de carne, queijo cheddar derretido e maionese artesanal da casa." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white focus:outline-none focus:border-cyan-500"></textarea>
        </div>

        <div class="sm:col-span-2 pt-2">
          <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 px-4 rounded-lg transition duration-200 text-sm">
            + Cadastrar Produto
          </button>
        </div>
      </form>
      <div id="mensagemStatus" class="mt-3 text-sm hidden"></div>
    </div>

    <!-- Listagem de Produtos Cadastrados -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-bold text-white">Produtos Registrados no Banco</h2>
        <button onclick="carregarProdutos()" class="text-xs text-cyan-400 hover:underline">Atualizar Lista</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-800 text-slate-400 uppercase text-xs">
            <tr>
              <th class="py-3 px-4">Item & Descrição</th>
              <th class="py-3 px-4">Preço Venda</th>
              <th class="py-3 px-4">Custo Insumo</th>
              <th class="py-3 px-4">Margem de Lucro</th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos" class="divide-y divide-slate-800">
            <tr>
              <td colspan="4" class="py-4 text-center text-slate-500">Carregando produtos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Script de Integração com o Supabase -->
  <script>
    const SUPABASE_URL = "https://ubtgyzcdvumfxgujpshz.supabase.co"; 
    const SUPABASE_ANON_KEY = "sb_publishable_eH09_dM0w0DreGw8JOx7mg_P1w3rZGC";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Função para carregar e exibir produtos salvos na tabela cardapio
    async function carregarProdutos() {
      const tabela = document.getElementById('tabelaProdutos');
      tabela.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-500">Buscando do banco...</td></tr>`;

      const { data, error } = await supabaseClient
        .from('cardapio')
        .select('*');

      if (error) {
        tabela.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-red-400">Erro ao carregar dados: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tabela.innerHTML = `<tr><td colspan="4" class="py-4 text-center text-slate-500">Nenhum produto cadastrado até o momento.</td></tr>`;
        return;
      }

      tabela.innerHTML = data.map(p => {
        const preco = parseFloat(p.preco_venda || 0);
        const custo = parseFloat(p.custo || 0);
        const lucro = preco - custo;
        const margem = preco > 0 ? ((lucro / preco) * 100).toFixed(1) : 0;
        const nomeItem = p.nome || 'Produto sem nome';
        const descricaoText = p.descricao || 'Sem descrição informada.';

        return `
          <tr class="hover:bg-slate-800/50">
            <td class="py-3 px-4">
              <div class="font-semibold text-white">${nomeItem}</div>
              <div class="text-xs text-slate-400 truncate max-w-xs mt-0.5">${descricaoText}</div>
            </td>
            <td class="py-3 px-4 text-emerald-400 font-medium">R$ ${preco.toFixed(2)}</td>
            <td class="py-3 px-4 text-rose-400 font-medium">R$ ${custo.toFixed(2)}</td>
            <td class="py-3 px-4">
              <span class="inline-block bg-cyan-950 text-cyan-400 text-xs px-2.5 py-1 rounded border border-cyan-800 font-medium">
                R$ ${lucro.toFixed(2)} (${margem}%)
              </span>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Função de envio com validação dos 4 campos e salvamento na tabela cardapio
    document.getElementById('formProduto').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nome = document.getElementById('nomeProduto').value.trim();
      const precoVendaStr = document.getElementById('precoVenda').value.trim();
      const custoInsumoStr = document.getElementById('custoInsumo').value.trim();
      const descricao = document.getElementById('descricaoProduto').value.trim();
      const msgStatus = document.getElementById('mensagemStatus');

      // Validação de campos vazios
      if (!nome || !precoVendaStr || !custoInsumoStr || !descricao) {
        msgStatus.className = "mt-3 text-sm text-red-400 font-semibold";
        msgStatus.textContent = "⚠️ Erro: Existe campo vazio! Por favor, preencha todos os 4 campos antes de cadastrar.";
        msgStatus.classList.remove('hidden');
        return;
      }

      const preco_venda = parseFloat(precoVendaStr);
      const custo = parseFloat(custoInsumoStr);

      msgStatus.className = "mt-3 text-sm text-cyan-400";
      msgStatus.textContent = "Salvando produto na tabela cardapio...";
      msgStatus.classList.remove('hidden');

      // Inserção na tabela cardapio do Supabase
      const { data, error } = await supabaseClient
        .from('cardapio')
        .insert([{ nome, preco_venda, custo, descricao }]);

      if (error) {
        msgStatus.className = "mt-3 text-sm text-red-400";
        msgStatus.textContent = "Erro ao cadastrar: " + error.message;
      } else {
        msgStatus.className = "mt-3 text-sm text-emerald-400";
        msgStatus.textContent = "✅ Produto cadastrado com sucesso na tabela cardapio!";
        document.getElementById('formProduto').reset();
        carregarProdutos();
      }
    });

    // Carregar os produtos assim que a página é aberta
    window.onload = carregarProdutos;
  </script>
</body>
</html>
